name: Build Linux App

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # Use older Ubuntu for better compatibility

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r bongo_cat_app/requirements.txt
        pip install pyinstaller

    - name: Build Binary
      run: |
        # Build the single file executable
        # Note the colon (:) for Linux paths
        pyinstaller --noconsole --onefile --name "BongoCat_Linux" --add-data "bongo_cat_app/assets:assets" bongo_cat_app/main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BongoCat_Linux_App
        path: dist/BongoCat_Linux