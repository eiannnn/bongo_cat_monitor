name: Build Windows App

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4  # Updated to v4 for safety

    - name: Set up Python
      uses: actions/setup-python@v5 # Updated to v5 for safety
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install the dependencies from your renamed file
        pip install -r bongo_cat_app/requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        # Build the EXE
        pyinstaller --noconsole --onefile --name "BongoCat_Setup" --add-data "bongo_cat_app/assets;assets" bongo_cat_app/main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4  # <--- THIS IS THE FIX (v3 -> v4)
      with:
        name: BongoCat_Windows_App
        path: dist/BongoCat_Setup.exe