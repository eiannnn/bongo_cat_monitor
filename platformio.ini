[platformio]
src_dir = .

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 315200

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.30
  lvgl/lvgl @ ^8.3.6

build_flags =
  ; --- NEW LINES START ---
  -DLV_CONF_INCLUDE_SIMPLE
  -I.
  ; --- NEW LINES END ---

  -DUSER_SETUP_LOADED=1
  
  ; Driver for the screen
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_INVERSION_ON
  
  ; Pin Mappings for ESP32-2432S028R
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  
  ; Font and Graphic settings
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000